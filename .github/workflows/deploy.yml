name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build-time only, but a product sold on data sovereignty should not be
  # phoning anywhere from its own pipeline either.
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Plain install. --omit=optional would also drop the platform binaries
      # that rollup (used by Vitest) and Next's SWC compiler ship as optional
      # deps, which breaks the test step. sharp is installed but never loaded,
      # since images.unoptimized is set.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Fail on known vulnerabilities in shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # Unset means the tool ships inert and sends nothing. Set this in
          # repository variables only after legal sign-off, and only to an
          # endpoint that does not log IP addresses.
          NEXT_PUBLIC_TELEMETRY_ENDPOINT: ${{ vars.TELEMETRY_ENDPOINT }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
