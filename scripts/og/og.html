<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Source for public/og-image.png. Render with `npm run og`.
  Every figure is the tool's own arithmetic for its default workload,
  100K items x 1536 dimensions, in decimal units like the page.
-->
<style>
  @font-face { font-family: Archivo; font-weight: 600; src: url(../../fonts/archivo-latin-600-normal.woff2); }
  @font-face { font-family: Archivo; font-weight: 700; src: url(../../fonts/archivo-latin-700-normal.woff2); }
  @font-face { font-family: Mono; font-weight: 400; src: url(../../fonts/jetbrains-mono-latin-400-normal.woff2); }
  @font-face { font-family: Mono; font-weight: 700; src: url(../../fonts/jetbrains-mono-latin-700-normal.woff2); }
  :root { --ink: #15181e; --ink-2: #4d5666; --dim: #667085; --line: #e6e9ed; --panel: #f6f7f9;
          --blue: #096cf1; --teal: #0b7a6e; --teal-soft: #e6f5f3; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; display: flex; font-family: Archivo, sans-serif; color: var(--ink); background: #fff; }
  .left { width: 700px; display: flex; flex-direction: column; }
  .rail { height: 73px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding: 0 64px; }
  .rail img { height: 26px; }
  .rail b { font-size: 19px; font-weight: 600; }
  .rail span { font-family: Mono; font-size: 15px; color: var(--dim); }
  .hero { padding: 72px 64px 0; }
  h1 { font-size: 66px; line-height: 1.12; font-weight: 700; letter-spacing: -0.025em; }
  h1 em { font-style: normal; color: var(--blue); }
  .hero p { margin-top: 30px; font-size: 25px; line-height: 1.45; color: var(--ink-2); font-weight: 600; }
  .right { flex: 1; background: var(--panel); border-left: 1px solid var(--line); padding: 128px 44px 0; display: flex; flex-direction: column; gap: 22px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
  .verdict { border-top: 4px solid var(--teal); }
  .badge { display: inline-block; font-family: Mono; font-weight: 700; font-size: 14px; color: var(--teal); background: var(--teal-soft); padding: 4px 10px; border-radius: 5px; }
  .step { font-family: Mono; font-size: 15px; color: var(--dim); margin-left: 8px; }
  .verdict h2 { margin-top: 10px; font-size: 20px; font-weight: 600; color: var(--teal); line-height: 1.22; }
  .gauge { display: flex; align-items: center; gap: 22px; }
  .gauge .num { position: relative; width: 150px; }
  .gauge .num b { position: absolute; left: 0; right: 0; top: 40px; text-align: center; font-family: Mono; font-size: 30px; }
  .gauge .num i { position: absolute; left: 0; right: 0; top: 78px; text-align: center; font-family: Mono; font-style: normal; font-size: 14px; color: var(--dim); }
  .legend { font-family: Mono; font-size: 15px; color: var(--dim); line-height: 1.75; }
  .legend .on { color: var(--ink); }
  .legend span::before { content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #c9ced6; margin-right: 10px; }
  .legend .on::before { background: var(--teal); }
  table { width: 100%; border-collapse: collapse; font-family: Mono; font-size: 15px; }
  td { padding: 6px 0; border-top: 1px solid var(--line); color: var(--ink-2); }
  tr:first-child td { border-top: 0; color: var(--dim); }
  td + td { text-align: right; color: var(--teal); font-weight: 700; }
  tr:first-child td + td { color: var(--dim); font-weight: 400; }
</style>
</head>
<body>
  <div class="left">
    <div class="rail"><img src="../../public/actian-logo.svg" alt=""><b>VectorAI DB</b><span>/ sizing tool</span></div>
    <div class="hero">
      <h1>Do you need a<br><em>vector database?</em></h1>
      <p>Find out in 30 seconds.</p>
    </div>
  </div>
  <div class="right">
    <div class="card verdict">
      <span class="badge">TIER 0</span><span class="step">1 of 4</span>
      <h2>You don't need a vector<br>database yet</h2>
    </div>
    <div class="card gauge">
      <div class="num">
        <svg viewBox="0 0 186 112" width="150"><path d="M 16 100 A 77 77 0 0 1 170 100" fill="none" stroke="#e6e9ed" stroke-width="18"/>
          <path d="M 16 100 A 77 77 0 0 1 170 100" fill="none" stroke="#0b7a6e" stroke-width="18" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0.6"/></svg>
        <b>100K</b><i>items</i>
      </div>
      <div class="legend"><span class="on">Flat file</span><br><span>Keyword index</span><br><span>pgvector</span><br><span>Dedicated store</span></div>
    </div>
    <div class="card">
      <table>
        <tr><td>What it costs you</td><td>Today</td></tr>
        <tr><td>Raw vectors, float32</td><td>614 MB</td></tr>
        <tr><td>Brute-force scan</td><td>31-307 ms</td></tr>
      </table>
    </div>
  </div>
</body>
</html>
